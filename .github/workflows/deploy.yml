name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # The Larder project. The anon key is public by design; row-level security protects the data.
          # Repository variables of the same name override these if ever set.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://zmdcijdirhefmatdrujn.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptZGNpamRpcmhlZm1hdGRydWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1ODU5OTcsImV4cCI6MjEwNDE2MTk5N30.kBdDNRVyAeF7RLHjb1Ro3Yx5WZo1FABWiAdaWjO4KZo' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
