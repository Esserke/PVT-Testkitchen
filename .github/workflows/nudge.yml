name: Daily nudge

on:
  schedule:
    # 15:00 UTC is 17:00 in South Africa: after school, before supper.
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the notify function to send anything due
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not set; skipping." && exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://zmdcijdirhefmatdrujn.supabase.co/functions/v1/notify" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"run"}')
          cat /tmp/out.json
          [ "$code" = "200" ]
